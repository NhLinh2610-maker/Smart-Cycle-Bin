<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Smart Bin - AI Waste Detection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #0f3460, #16213e);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 18px; color: #4ecca3; }
        .header .status { font-size: 12px; color: #aaa; margin-top: 4px; }
        .camera-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            margin: 12px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #4ecca3;
        }
        #video {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }
        #canvas { display: none; }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 8px;
            width: 100%;
            max-width: 480px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .btn {
            flex: 1;
            padding: 14px 8px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-capture {
            background: linear-gradient(135deg, #4ecca3, #38b28a);
            color: #fff;
            box-shadow: 0 4px 15px rgba(78, 204, 163, 0.3);
        }
        .btn-auto {
            background: linear-gradient(135deg, #e94560, #c23152);
            color: #fff;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }
        .btn-auto.active {
            background: linear-gradient(135deg, #4ecca3, #38b28a);
            box-shadow: 0 4px 15px rgba(78, 204, 163, 0.3);
        }
        .btn-switch {
            background: linear-gradient(135deg, #533483, #3d2366);
            color: #fff;
            flex: 0.5;
        }
        .btn-open-door {
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: #fff;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4);
            font-size: 16px;
        }
        /* ===== BATTERY DASHBOARD ===== */
        .battery-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin: 8px 0;
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(78, 204, 163, 0.3);
        }
        .battery-icon {
            position: relative;
            width: 48px;
            height: 24px;
            border: 2px solid #4ecca3;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 6px;
            width: 4px;
            height: 8px;
            background: #4ecca3;
            border-radius: 0 2px 2px 0;
        }
        .battery-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f44336, #ff9800, #4ecca3);
            transition: width 0.5s ease;
        }
        .battery-fill.low { background: #f44336; }
        .battery-fill.medium { background: #ff9800; }
        .battery-fill.good { background: #4ecca3; }
        .battery-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            z-index: 2;
        }
        .battery-info {
            flex: 1;
        }
        .battery-label {
            font-size: 14px;
            color: #4ecca3;
            font-weight: bold;
        }
        .battery-voltage {
            font-size: 12px;
            color: #aaa;
        }
        .result-box {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin: 8px 0;
            min-height: 80px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .result-box h3 { color: #4ecca3; margin-bottom: 8px; font-size: 15px; }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        .result-item .label { color: #aaa; }
        .result-item .value { color: #fff; font-weight: bold; }
        .waste-type {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            margin-top: 8px;
            font-size: 16px;
        }
        .type-1 { background: rgba(76, 175, 80, 0.3); color: #4caf50; border: 1px solid #4caf50; }
        .type-2 { background: rgba(33, 150, 243, 0.3); color: #2196f3; border: 1px solid #2196f3; }
        .type-3 { background: rgba(255, 152, 0, 0.3); color: #ff9800; border: 1px solid #ff9800; }
        .type-4 { background: rgba(244, 67, 54, 0.3); color: #f44336; border: 1px solid #f44336; }
        .type-0 { background: rgba(158, 158, 158, 0.3); color: #9e9e9e; border: 1px solid #9e9e9e; }
        .preview-container {
            width: 100%;
            max-width: 480px;
            margin: 8px 0;
        }
        #preview {
            width: 100%;
            border-radius: 8px;
            display: none;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #4ecca3;
        }
        .loading.show { display: block; }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #4ecca3;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🗑️ Smart Bin - AI Waste Detection</h1>
        <div class="status" id="serverStatus">Đang kết nối server...</div>
    </div>

    <!-- ===== BATTERY DASHBOARD ===== -->
    <div class="battery-box" id="batteryBox">
        <div class="battery-icon">
            <div class="battery-fill" id="batteryFill"></div>
            <span class="battery-text" id="batteryText">--%</span>
        </div>
        <div class="battery-info">
            <div class="battery-label">🔋 Pin 3S 18650</div>
            <div class="battery-voltage" id="batteryVoltage">-- V</div>
        </div>
    </div>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
    </div>
    <canvas id="canvas"></canvas>

    <div class="controls">
        <div class="btn-row">
            <button class="btn btn-open-door" onclick="openDoor()">🚪 Mở cửa lấy rác</button>
        </div>
        <div class="btn-row">
            <button class="btn btn-switch" onclick="switchCamera()">🔄</button>
            <button class="btn btn-capture" onclick="captureAndDetect()">📸 Chụp & Nhận diện</button>
            <button class="btn btn-auto" id="autoBtn" onclick="toggleAuto()">⏱️ Tự động</button>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Đang nhận diện...</div>
    </div>

    <div class="result-box">
        <h3>📊 Kết quả nhận diện</h3>
        <div class="result-item">
            <span class="label">Loại rác:</span>
            <span class="value" id="wasteClass">Chưa có</span>
        </div>
        <div class="result-item">
            <span class="label">Độ tin cậy:</span>
            <span class="value" id="wasteConf">-</span>
        </div>
        <div class="result-item">
            <span class="label">Ngăn rác:</span>
            <span class="value" id="wasteBin">-</span>
        </div>
        <div class="waste-type type-0" id="wasteTypeBadge">Chờ phát hiện...</div>
    </div>

    <div class="preview-container">
        <img id="preview" alt="Preview">
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('preview');
        const loading = document.getElementById('loading');
        const autoBtn = document.getElementById('autoBtn');

        let currentStream = null;
        let facingMode = 'environment'; // Camera sau mac dinh
        let autoMode = false;
        let autoInterval = null;
        let isDetecting = false;

        // Khoi tao camera
        async function initCamera() {
            const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            if (!isSecure && navigator.mediaDevices === undefined) {
                document.getElementById('serverStatus').textContent = '⚠️ Cần HTTPS! Dùng: ngrok http 5000';
                showToast('⚠️ Camera cần HTTPS! Chạy: ngrok http 5000');
                return;
            }
            if (navigator.mediaDevices === undefined) {
                navigator.mediaDevices = {};
            }
            if (navigator.mediaDevices.getUserMedia === undefined) {
                navigator.mediaDevices.getUserMedia = function(constraints) {
                    var getUserMedia = navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
                    if (!getUserMedia) {
                        return Promise.reject(new Error('getUserMedia không được hỗ trợ'));
                    }
                    return new Promise(function(resolve, reject) {
                        getUserMedia.call(navigator, constraints, resolve, reject);
                    });
                };
            }
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(t => t.stop());
                }
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                document.getElementById('serverStatus').textContent = 'Camera sẵn sàng ✓';
            } catch (err) {
                console.error('Camera error:', err);
                document.getElementById('serverStatus').textContent = 'Lỗi camera: ' + err.message;
                showToast('Lỗi camera! Thử HTTPS với ngrok');
            }
        }

        // Doi camera truoc/sau
        function switchCamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            initCamera();
            showToast(facingMode === 'environment' ? '📷 Camera sau' : '🤳 Camera trước');
        }

        // Chup anh va nhan dien
        async function captureAndDetect() {
            if (isDetecting) return;
            isDetecting = true;
            loading.classList.add('show');

            try {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);

                // Hien preview
                preview.src = canvas.toDataURL('image/jpeg', 0.8);
                preview.style.display = 'block';

                // Gui len server
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('image', blob, 'capture.jpg');

                    try {
                        const resp = await fetch('/detect', {
                            method: 'POST',
                            body: formData
                        });
                        const data = await resp.json();
                        updateResult(data);
                    } catch (err) {
                        showToast('❌ Lỗi kết nối server');
                        console.error(err);
                    } finally {
                        loading.classList.remove('show');
                        isDetecting = false;
                    }
                }, 'image/jpeg', 0.8);
            } catch (err) {
                console.error(err);
                loading.classList.remove('show');
                isDetecting = false;
            }
        }

        // Cap nhat hien thi ket qua
        function updateResult(data) {
            const classNames = {
                0: 'Không phát hiện',
                1: 'Organic Waste',
                2: 'Recyclable Waste',
                3: 'Inorganic Waste',
                4: 'Hazardous Waste'
            };
            const binNames = {
                0: '-',
                1: 'Ngăn 1 (Organic)',
                2: 'Ngăn 2 (Recyclable)',
                3: 'Ngăn 3 (Inorganic)',
                4: 'Ngăn 4 (Hazardous)'
            };

            const cid = data.class_id || 0;
            document.getElementById('wasteClass').textContent = classNames[cid] || data.class_name || 'Unknown';
            document.getElementById('wasteConf').textContent = data.confidence ? (data.confidence * 100).toFixed(1) + '%' : '-';
            document.getElementById('wasteBin').textContent = binNames[cid] || '-';

            const badge = document.getElementById('wasteTypeBadge');
            badge.className = 'waste-type type-' + cid;
            badge.textContent = cid > 0 ? `🗑️ ${classNames[cid]} → ${binNames[cid]}` : 'Chờ phát hiện...';

            if (cid > 0) {
                showToast(`✅ ${classNames[cid]} - Gửi ESP32 thành công!`);
            } else {
                showToast('⚠️ Không phát hiện rác');
            }
        }

        // Bat/tat che do tu dong
        function toggleAuto() {
            autoMode = !autoMode;
            autoBtn.classList.toggle('active', autoMode);
            autoBtn.textContent = autoMode ? '⏹️ Dừng' : '⏱️ Tự động';

            if (autoMode) {
                showToast('⏱️ Tự động chụp mỗi 3 giây');
                autoInterval = setInterval(() => {
                    if (!isDetecting) captureAndDetect();
                }, 3000);
            } else {
                clearInterval(autoInterval);
                autoInterval = null;
                showToast('⏹️ Đã dừng tự động');
            }
        }

        // Mo cua thung rac tu web app
        async function openDoor() {
            try {
                const btn = document.querySelector('.btn-open-door');
                btn.disabled = true;
                btn.textContent = '⏳ Đang mở...';
                loading.classList.add('show');

                const resp = await fetch('/open_door', { method: 'POST' });
                const data = await resp.json();

                if (data.success) {
                    showToast('🚪 Yêu cầu mở cửa đã gửi!');
                } else {
                    showToast('❌ Lỗi: ' + data.message);
                }
            } catch (err) {
                console.error(err);
                showToast('❌ Lỗi kết nối server');
            } finally {
                setTimeout(() => {
                    loading.classList.remove('show');
                    const btn = document.querySelector('.btn-open-door');
                    btn.disabled = false;
                    btn.textContent = '🚪 Mở cửa lấy rác';
                }, 1500);
            }
        }

        // ===== BATTERY DASHBOARD =====
        let batteryInterval = null;
        async function updateBattery() {
            try {
                const resp = await fetch('/battery');
                const data = await resp.json();
                const percent = data.percent || 0;
                const voltage = data.voltage || 0;

                const fill = document.getElementById('batteryFill');
                const text = document.getElementById('batteryText');
                const volt = document.getElementById('batteryVoltage');

                fill.style.width = percent + '%';
                text.textContent = percent + '%';
                volt.textContent = voltage.toFixed(2) + ' V';

                // Color class based on level
                fill.classList.remove('low', 'medium', 'good');
                if (percent <= 20) fill.classList.add('low');
                else if (percent <= 50) fill.classList.add('medium');
                else fill.classList.add('good');
            } catch (err) {
                console.error('Battery fetch error:', err);
            }
        }

        // Toast thong bao
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Khoi dong
        initCamera();
        // Start battery polling
        updateBattery();
        batteryInterval = setInterval(updateBattery, 5000);
        window.addEventListener('beforeunload', () => {
            if (batteryInterval) clearInterval(batteryInterval);
        });
    </script>
</body>
</html>
